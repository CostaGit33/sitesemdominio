    .goalkeeper-metric span{font-size:.78rem;opacity:.72}
    .goalkeeper-history{display:grid;gap:8px}
    .goalkeeper-history article{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-radius:12px;background:rgba(255,255,255,.05)}
