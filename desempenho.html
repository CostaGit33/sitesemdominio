<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutPontos – Desempenho Completo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07080D">
  <link rel="icon" href="futponts_large.png" type="image/png">
  <link rel="apple-touch-icon" href="futponts_large.png">
  <link rel="stylesheet" href="common-nav.css">
  <link rel="stylesheet" href="classificacao.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .complete-section { width:100%; max-width:1400px; margin:0 auto; padding:2rem 1rem; }
    .complete-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; }
    .complete-card { position:relative; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:15px; padding:20px; overflow:hidden; }
    .complete-card h3 { margin:0 0 4px; color:#00ff88; font-size:1.2rem; }
    .player-id { opacity:.55; font-size:.75rem; margin-bottom:14px; }
    .section-title { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; opacity:.65; margin:16px 0 8px; }
    .api-grid,.tech-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .stat { background:rgba(255,255,255,.04); border-radius:8px; padding:9px; display:flex; justify-content:space-between; gap:8px; }
    .stat strong { color:#00ff88; }
    .tech-grid .stat { display:block; text-align:center; }
    .tech-grid .stat strong { display:block; font-size:1.2rem; margin-top:3px; }
    .average { margin-top:14px; text-align:center; padding:10px; border:1px solid rgba(0,255,136,.25); border-radius:10px; }
    .average strong { color:#00ff88; font-size:1.25rem; }
    .chart-wrap { max-width:300px; margin:10px auto 0; }
    .missing { opacity:.65; font-size:.9rem; padding:10px; background:rgba(255,255,255,.04); border-radius:8px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0; justify-content:center; }
    .toolbar input { width:min(100%,360px); padding:11px 14px; border-radius:9px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:#fff; outline:none; }
    .status { text-align:center; opacity:.7; margin:15px 0; }
    @media(max-width:480px){ .complete-section{padding:1rem .75rem}.complete-grid{grid-template-columns:1fr}.complete-card{padding:15px} }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img src="futponts_large.png" class="brand-logo" alt="FutPontos Logo"></div>
    <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    <nav class="app-nav" aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Classificação</a></li>
        <li><a href="goleiros.html">Goleiros</a></li>
        <li><a href="desempenho.html">Desempenho</a></li>
        <li><a href="desempenho-completo.html">Desempenho Completo</a></li>
        <li><a href="analise-semana.html">Análises</a></li>
        <li><a href="topo.html">Topos</a></li>
        <li><a href="videos.html" target="_blank">Vídeos</a></li>
      </ul>
    </nav>
  </header>

  <main class="app-main">
    <section class="complete-section">
      <header class="section-header">
        <h2>Desempenho Completo</h2>
        <p style="text-align:center;opacity:.7;margin-top:10px">Dados da API + avaliação técnica individual</p>
      </header>
      <div class="toolbar">
        <input id="searchPlayer" type="search" placeholder="Buscar jogador..." autocomplete="off">
      </div>
      <div id="completeStatus" class="status">Carregando jogadores...</div>
      <div id="completeContainer" class="complete-grid"></div>
    </section>
  </main>

  <footer class="app-footer"><div class="footer-content"><span>© 2026 • FutPontos</span></div></footer>
  <div id="feedback" aria-live="polite"></div>

  <script type="module" src="globais.js"></script>
  <script src="menu.js"></script>
  <script type="module" src="desempenho-completo.js"></script>
</body>
</html>
