<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FutPontos – Goleiros</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07080D" />
  <link rel="icon" href="futponts_large.png" type="image/png" />
  <link rel="apple-touch-icon" href="futponts_large.png" />

  <link rel="stylesheet" href="common-nav.css" />
  <link rel="stylesheet" href="classificacao.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Mantém em goleiros o mesmo padrão visual dos cards de jogadores */
    #cards-goleiros .player-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    #cards-goleiros .player-card:hover {
      border-color: #ef3434;
    }

    #cards-goleiros .player-name,
    #cards-goleiros .player-name a {
      color: #ef3434;
      text-decoration: none;
    }

    #cards-goleiros .player-name a:hover { opacity: .9; text-decoration: underline; }
    #cards-goleiros .goalkeeper-photo-link img {
      width: 104px; height: 104px; object-fit: cover; border-radius: 50%;
      border: 2px solid rgba(239,52,52,.75); margin: 24px auto 12px; display: block;
    }
    #cards-goleiros .player-points { display:block; color:#ef3434; font-size:1.15rem; margin:8px 0; }
    #cards-goleiros .progress-bar { width:100%; height:5px; background:rgba(255,255,255,.1); border-radius:8px; overflow:hidden; margin:8px 0 12px; }
    #cards-goleiros .progress-fill { height:100%; background:#ef3434; border-radius:8px; }
    #cards-goleiros .player-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; font-size:.8rem; opacity:.85; }
    #cards-goleiros .goalkeeper-profile-link { margin-top:14px; color:#ef7777; text-decoration:none; font-size:.85rem; font-weight:700; }
  </style>
  <link rel="stylesheet" href="ux-enhancements.css?v=1" />
  <link rel="stylesheet" href="ux-pages.css?v=1" />
</head>
<body>

  <!-- BANNER INSTALL PWA -->
  <div class="install-banner" id="install-banner" aria-label="Instalar aplicativo">
    <div class="install-banner-text">
      <strong>Instale o FutPontos no seu celular</strong>
      <p>Acesso rápido, tela cheia, funciona offline.</p>
    </div>
    <div class="install-banner-actions">
      <button class="install-btn primary" id="install-confirm">Instalar</button>
      <button class="install-btn" id="install-dismiss">Agora não</button>
    </div>
  </div>

  <header class="app-header">
    <div class="brand">
      <img src="futponts_large.png" class="brand-logo" alt="FutPontos Logo" />
    </div>
    <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    <nav class="app-nav" aria-label="Navegação principal">
      <ul>
        <li><a href="classificacao.html">Classificação</a></li>
        <li><a href="jogador.html">Perfis</a></li>
        <li><a href="goleiros.html" class="active">Goleiros</a></li>
        <li><a href="desempenho.html">Desempenho</a></li>
        
        
        
      </ul>
    </nav>
  </header>

  <main class="app-main">

    <section class="classification-section">
      <header class="section-header">
        <h2>Ranking de Goleiros</h2>
      </header>
      <div class="table-wrapper">
        <table aria-label="Tabela de goleiros">
          <thead>
            <tr>
              <th>#</th>
              <th>Goleiro</th>
              <th>P</th>
              <th>V</th>
              <th>E</th>
              <th>G</th>
              <th>D</th>
              <th>INF</th>
            </tr>
          </thead>
          <tbody id="tabela-goleiros">
          </tbody>
        </table>
      </div>
    </section>

    <section class="cards-section">
      <header class="section-header">
        <h2>Mural de Goleiros</h2>
      </header>
      <div class="cards" id="cards-goleiros">
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <span>© 2026 • FutPontos • semdominio.online</span>
    </div>
  </footer>

  <div id="feedback" aria-live="polite"></div>

  <script type="module" src="globais.js"></script>
  <script src="menu.js?v=59"></script>
  <script type="module" src="goleiros.js?v=58"></script>

</body>
</html>
