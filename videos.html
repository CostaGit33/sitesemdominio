<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FutPontos • Vídeos</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050507" />
  <link rel="icon" href="futponts_large.png" type="image/png" />
  <link rel="apple-touch-icon" href="futponts_large.png" />
  <link rel="stylesheet" href="common-nav.css" />
  <style>
    :root{--reels-bg:#050507;--reels-red:#e11d35;--reels-muted:#b5b8c3}
    html,body{background:var(--reels-bg);overflow:hidden}.app-header{position:fixed;top:0;left:0;right:0;z-index:20;background:linear-gradient(#050507dd,#05050700);box-shadow:none}.app-header .brand-logo{filter:drop-shadow(0 2px 4px #000)}
    .reels-shell{position:fixed;inset:0;background:var(--reels-bg)}.reels-topbar{position:absolute;z-index:10;top:82px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;color:#fff;text-shadow:0 1px 5px #000;pointer-events:none}.reels-topbar h1{margin:0;font-size:1.1rem}.reels-topbar span{color:#ffffffaa;font-size:.8rem}
    .reels-feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.reels-feed::-webkit-scrollbar{display:none}.reel{position:relative;height:100dvh;min-height:520px;scroll-snap-align:start;background:#101116;isolation:isolate}.reel video{width:100%;height:100%;display:block;object-fit:cover;background:#090a0e}.reel:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#0007 0%,transparent 23%,transparent 58%,#000b 100%)}.reel-loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;z-index:0}.reel-copy{position:absolute;z-index:3;left:20px;right:85px;bottom:28px;color:#fff;text-shadow:0 2px 5px #000}.reel-copy h2{margin:0 0 7px;font-size:1.1rem}.reel-copy p{margin:0;color:#e4e5eb;font-size:.82rem}.reel-actions{position:absolute;z-index:4;right:15px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:16px}.reel-action{width:46px;height:46px;border:0;border-radius:50%;background:#0008;color:#fff;display:grid;place-items:center;font-size:1.25rem;cursor:pointer;backdrop-filter:blur(8px)}.reel-action:hover{background:var(--reels-red)}.reel-action small{position:absolute;margin-top:64px;color:#fff;font-size:.68rem;font-weight:700}.reel-counter{position:absolute;z-index:4;right:18px;top:86px;padding:6px 10px;border-radius:99px;background:#0008;color:#fff;font-size:.72rem}.reels-status{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:20px;color:#fff;text-align:center}.reels-status.hidden{display:none}.reel-play{position:absolute;z-index:3;inset:0;margin:auto;width:68px;height:68px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:1.8rem;opacity:0;pointer-events:none;transition:opacity .2s}.reel.paused .reel-play{opacity:1}
    @media(max-width:768px){.app-header{background:linear-gradient(#050507dd,transparent)}.reels-topbar{top:62px}.reel-copy{bottom:26px}.reel-actions{bottom:28px}}@media(min-width:769px){.reels-feed{width:min(520px,100%);margin:0 auto}.reel{border-left:1px solid #ffffff10;border-right:1px solid #ffffff10}.reels-topbar{top:24px}}
  </style>
</head>
<body>
  <div class="install-banner" id="install-banner" aria-label="Instalar aplicativo"><div class="install-banner-text"><strong>Instale o FutPontos no seu celular</strong><p>Acesso rápido, tela cheia, funciona offline.</p></div><div class="install-banner-actions"><button class="install-btn primary" id="install-confirm">Instalar</button><button class="install-btn" id="install-dismiss">Agora não</button></div></div>
  <header class="app-header"><div class="brand"><img src="futponts_large.png" class="brand-logo" alt="FutPontos Logo" /></div><button class="menu-toggle" aria-label="Abrir menu">☰</button><nav class="app-nav" aria-label="Navegação principal"><ul><li><a href="classificacao.html">Classificação</a></li><li><a href="jogador.html">Perfis</a></li><li><a href="goleiros.html">Goleiros</a></li><li><a href="desempenho.html">Desempenho</a></li><li><a href="analise-semana.html">Análises</a></li><li><a href="topo.html">Topos</a></li><li><a href="videos.html" class="active">Vídeos</a></li></ul></nav></header>
  <main class="reels-shell"><div class="reels-topbar"><h1>Vídeos</h1><span id="videosStatus">Carregando...</span></div><section class="reels-feed" id="videosGrid" aria-label="Feed de vídeos"></section><div class="reels-status" id="reelsStatus">Carregando clips...</div></main>
  <script src="menu.js?v=57"></script><script type="module" src="videos.js?v=1"></script>
</body>
</html>
